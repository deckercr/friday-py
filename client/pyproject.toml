[project]
name = "friday-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "pillow>=10.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "websockets>=13.0",
    "openwakeword>=0.6",
    "onnxruntime>=1.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
